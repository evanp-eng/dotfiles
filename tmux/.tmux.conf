### ---- Overall niceties ----
set -g mouse on
# don't rename windows automatically
set-option -g allow-rename off

# true color support (scope to your real $TERM outside tmux; xterm-256color is
# the common case — swap for your terminal's actual TERM, e.g. alacritty, screen-256color)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# fix escape delay for vim, without breaking arrow-key escape sequences
set -sg escape-time 10

### ---- Prefix ----
unbind C-b
unbind '"'
unbind %
set -g prefix C-Space
bind Space send-prefix

### ---- Splitting (Spacemacs-style at prefix level) ----
bind / split-window -h
bind - split-window -v

### ---- Terminator-style splitting/resizing, no prefix needed ----
bind -n C-E split-window -h
bind -n C-O split-window -v
bind -n C-S-Left resize-pane -L 3
bind -n C-S-Right resize-pane -R 3
bind -n C-S-Up resize-pane -U 3
bind -n C-S-Down resize-pane -D 3

### ---- Pane navigation without prefix ----
# NOTE: if you install vim-tmux-navigator (recommended below), delete this
# block — the plugin replaces these bindings with smarter ones that also
# reach into vim splits.
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# copy mouse selection straight to the system clipboard on release
# bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"

bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -i > /dev/null 2>&1"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -i > /dev/null 2>&1"

# copy mouse selection straight to the system clipboard on release (xsel version)
# bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "xsel -i --clipboard"
# bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xsel -i --clipboard"

# copy mouse selection straight to the system clipboard on release (wayland copy version)
# bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

### ---- Plugins (via TPM) ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'   # modern tmuxline.vim replacement

set -g @catppuccin_flavor "mocha"

# keep this at the very bottom of the file
run '~/.tmux/plugins/tpm/tpm'
